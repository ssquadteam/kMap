    debug: ""
  desc:
    help: "Show this list"
    toggle: "Open or close the map"
    module: "Choose what the map key opens"
    shape: "Square or round minimap"
    corner: "Move the minimap to a screen corner"
    zoom: "Zoom the minimap"
    sens: "Cursor speed on the full-screen map"
    reload: "Reload config, language and locations"
    locations-reload: "Reload locations.yml only"
    world-register: "Register a world for a baked map"
    rebake: "Render a baked world map again"
    refresh: "Re-read map colours around you"
    area: "Bake extra areas of a registered world"
    world: "List worlds, or visit one"
    testperm: "Preview a location permission on yourself"
    pack: "Rebuild and resend the resource pack"
    debug: "Print your map session state"
  detail:
    help: "Lists every kMap command you can use. /kmap on its own shows the same list."
    toggle: "Same as your map key (F by default). Opens the big map or the full-screen map depending on your settings."
    module: "minimap_only keeps just the minimap. minimap_and_big adds a large overlay map. minimap_and_screen adds the draggable full-screen map. The last two hide the minimap."
    shape: "Changes the minimap outline. Your choice is saved."
    corner: "Places the minimap in any of the four corners of your screen."
    zoom: "Steps the minimap zoom in or out. reset goes back to the world default."
    sens: "How far the cursor moves per mouse movement on the full-screen map. Same as /sens."
    reload: "Re-reads config.yml, worlds.yml, the language files and locations.yml, then rebuilds the resource pack."
    locations-reload: "Re-reads locations.yml without touching anything else. Keeps the old list if the file has an error."
    world-register: "Writes a WORLD_VIEW_HD entry to worlds.yml. The world bakes into one image on the next start or /kmap rebake."
    rebake: "Throws away the cached image of a baked world and renders it again from the saved chunks."
    refresh: "Re-samples every explored chunk within the radius. Use it after WorldEdit or Axiom edits."
    area: "add stages an area centred on you and asks you to accept it. confirm saves it and re-bakes the world, cancel drops it, remove deletes one, list shows them all."
    world: "Without a name it lists loaded worlds and world folders on disk. With a name it loads the world if needed and sends you to its spawn."
    testperm: "Turns a location permission on or off for you only, so you can check what players without it see on the map."
    pack: "Rebuilds the kMap resource pack from the jar and your contents folder and sends it to everyone online."
    debug: "Shows cursor, zoom, tiles, cache size and render mode of your map session. Useful when reporting a problem."
