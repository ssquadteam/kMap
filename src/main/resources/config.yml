# kMap configuration. A missing key falls back to its default. /kmap reload re-reads this file.

language: "en"

render:
  # What the toggle key opens for a new player: MINIMAP_ONLY, MINIMAP_AND_BIG, MINIMAP_AND_SCREEN, BIG_MAP_ONLY, SCREEN_MAP_ONLY
  defaultModule: "MINIMAP_AND_SCREEN"
  defaultMinimapShape: "SQUARE"
  defaultMinimapPlacement: "TOP_LEFT"
  coordinatesEnabled: true
  openMapOnJoin: true
  joinOpenDelayTicks: 20
  # Full-colour streamed maps: biome tints, block texture tones, shadows, contour lines and water depth.
  # false uses the 62 vanilla map colours instead (half the map tiles per player, flatter look).
  rgbTextured: true
  # Shader packs (Iris, OptiFine) replace the shaders kMap draws with, so the map cannot show for them.
  # While the map is open, only players with a shader pack see the lang line shaders.hint.
  shaderHint: true
  discoverRadiusChunks: 6
  tilesPerFlush: 4
  flushIntervalTicks: 2
  streamRadiusChunks: 10
  minimapSizePx: 64
  minimapBlocks: 88
  bigMapSizePx: 300
  bigMapBlocks: 360
  cave:
    layerHeight: 8
    computeRadiusChunks: 6
    snapshotsPerTick: 24

cursor:
  defaultSensitivity: 1.0
  pixelsPerDegree: 4.0

markers:
  distanceUpdateTicks: 20
  entities:
    enabled: true
    players: true
    mobs: true
    radiusBlocks: 44
    heightRadius: 8
    updateTicks: 3
    animationTicks: 10
    sizePx: 6
    maxPerPlayer: 24
    playerImage: "player_red.png"
    mobImage: "mob_yellow.png"

# Guilds plugin integration, ignored when Guilds is not installed.
guilds:
  enabled: true
  # Guildmates and allied guilds show on every map in the same world at any distance,
  # as a coloured square clamped to the minimap edge when far away. Hover one on the full map for its guild.
  members: true
  allies: true
  memberColor: "#96C446"
  allyColor: "#78C8DC"
  # The guild home (/guild sethome) shows as a pin only its members see. Searchable, click to track.
  home: true
  homeIcon: "house"
  # "Share with guild" in the waypoint editor. Every member sees shared waypoints;
  # the creator and the guild master can edit or delete them.
  sharedWaypoints: true

guis:
  settings: true
  faq: true
  waypoints: true
  newWaypoint: true
  search: true
  zoomButtons: true
  resetView: true

binds:
  enabled: true
  toggleMap:
    - gesture: "SWAP_HANDS"
      sneaking: null
      hand: "ANY"

storage:
  type: "FILE"
  save:
    # Explored areas (fog of war) per player and world.
    discovery: true
    # Player waypoints.
    markers: true
    # Map colours of explored chunks, so far areas show after restarts without loading them.
    worldColors: true
  # Seconds between background saves of explored areas and map colours.
  autosaveSeconds: 120
  terrain:
    # Chunks of map colour kept in memory per world; older ones are dropped and read back from disk when needed.
    memoryChunks: 16000

resourcepack:
  setOnJoin: true
  required: false
  prompt: "kMap needs its resource pack to draw the map."
  description: "kMap - minimap, waypoints & markers"
  joinDelayTicks: 1
  hosting:
    # SELF_HOST | EXTERNAL | NONE
    mode: "SELF_HOST"
    selfHost:
      bindIp: "0.0.0.0"
      port: 8163
      # "auto" uses server-ip from server.properties, otherwise 127.0.0.1. Put your public IP or domain here.
      publicAddress: "auto"
    external:
      url: ""
  merge:
    # AUTO hands the kMap pack to Nexo, ItemsAdder or Oraxen (the first one installed) so players download one pack.
    # NONE | AUTO | NEXO | ITEMSADDER | ORAXEN
    target: "AUTO"
    # Extra packs (zip files or folders inside plugins/kMap) merged into the kMap pack.
    packs: []

debug:
  logs: false
